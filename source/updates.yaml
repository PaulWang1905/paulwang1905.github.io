# Recent updates. The home page shows the latest five; every entry is listed
# on the "All updates" page (/updates.html). Order doesn't matter: oxie sorts
# by date, newest first.
#
# Each entry needs a date (YYYY-MM-DD) and content. Write content as a ">-"
# block: a plain one-line value breaks on any ": " inside it. HTML is
# allowed; use <br> for a line break. Links are styled by the templates, so a
# plain <a href="..."> is enough.
#
# Migrated from the Google Sheet's Date and Content columns.

- date: 2026-10-26
  content: >-
    I presented our short paper, <i>From Triples to Cards: A Web Component for
    Human-Readable Linked Open Data</i>, at the
    <a href="https://data-driven-storytelling-workshop.replit.app/">Data-Driven Storytelling Workshop (DDS 2026)</a>
    at ISWC 2026 in Bari, Italy. See the
    <a href="https://drive.google.com/file/d/19B1UWmZxGmS8N6dBJZ3njPp-BmrsKOki/view?usp=sharing">presentation slides</a>.

- date: 2026-09-13
  content: >-
    The arXiv draft of a recent work,
    <a href="https://arxiv.org/abs/2609.14739"><i>Building Legal Reward Models
    for Grounding and Abstention</i></a>, is now available. It was presented
    at the ICML 2026 AI4Law Workshop.

- date: 2026-05-01
  content: >-
    I presented my work on LODox and my thoughts on Solid for Cultural
    Heritage in a special session, <i>Solid Future(s) for Digital Heritage:
    Decentralising Access and Building Trust</i>, at
    <a href="https://sosy2026.eu/">Solid Symposium 2026</a>.

- date: 2026-03-08
  content: >-
    We hosted the
    <a href="https://conference.oxai.org/">3rd Oxford Artificial Intelligence Society Conference</a>
    at the Oxford e-Research Centre and the Department of Computer Science,
    University of Oxford. 🎉

- date: 2025-11-06
  content: >-
    We are pleased to announce the launch of the Oxford Digital Scholarship
    Society (OxDSS). Our inaugural event will take place from 4:00 PM to
    5:00 PM on Thursday of Week 4, Michaelmas Term 2025, at the Oxford
    e-Research Centre.

- date: 2025-06-07
  content: >-
    I am going to volunteer at the Oxford Pride Parade 2025 on 7 June.

- date: 2025-05-31
  content: >-
    At the <strong>Oxford Artificial Intelligence Society</strong>, we hosted
    our <strong>inaugural AI Gala</strong> on 31 May 2025. We were humbled by
    the presence of over <strong>300 attendees</strong>, including
    researchers, founders, policymakers, and students, all contributing to a
    remarkable evening of conversation and connection.

- date: 2025-05-20
  content: >-
    I will give a talk titled 'AI-Assisted Data Analysis and Curatorial
    Planning for Museums' at the Oxford Digital Scholarship coffee mornings.
    These informal networking events are a chance to meet colleagues
    interested in digital scholarship research and hear about projects around
    the university. With talks ranging from ChatGPT for cultural heritage to
    video games, come along and find out more!<br>
    <strong>Time:</strong> 20th May, 3rd June, 10.30–11.30 AM<br>
    <strong>Venue:</strong> Visiting Scholars Centre, Weston Library

- date: 2025-04-10
  content: >-
    I am now one of the
    <a href="https://staff.admin.ox.ac.uk/article/introducing-the-ai-ambassador-programme">AI Ambassadors</a>
    at the University of Oxford! See the
    <a href="https://staff.admin.ox.ac.uk/ai-ambassadors">full list of AI Ambassadors</a>.

- date: 2025-03-16
  content: >-
    We successfully held the OxAI 2nd Mini-Conference! Grateful to all our
    speakers, panelists, and attendees for making it an engaging and
    thought-provoking event. Proud to serve as General Chair—thank you to
    everyone who contributed. Looking forward to the next one!

- date: 2024-03-05
  content: >-
    I gave a talk at the Oxford Suzhou Centre for Advanced Research on the
    emerging paradigm of data integration.
