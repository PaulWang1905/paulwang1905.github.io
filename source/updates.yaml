- date: 2025-11-06
  content: |-
    We are pleased to announce the launch of the Oxford Digital Scholarship Society (OxDSS).
    Our inaugural event will take place from 4:00 PM to 5:00 PM on Thursday of Week 4, Michaelmas Term 2025, at the Oxford e-Research Centre.

- date: 2025-06-07
  content: >-
    I am going to volunteer at Oxford Pride Parade 2025 at 7 Jun.

- date: 2025-05-31
  content: |-
    At 𝐎𝐱𝐟𝐨𝐫𝐝 𝐀𝐫𝐭𝐢𝐟𝐢𝐜𝐢𝐚𝐥 𝐈𝐧𝐭𝐞𝐥𝐥𝐢𝐠𝐞𝐧𝐜𝐞 𝐒𝐨𝐜𝐢𝐞𝐭𝐲, we hosted our 𝐢𝐧𝐚𝐮𝐠𝐮𝐫𝐚𝐥 𝐀𝐈 𝐆𝐚𝐥𝐚 at 31 May 2025.
    We were humbled by the presence of over 𝟑𝟎𝟎 𝐚𝐭𝐭𝐞𝐧𝐝𝐞𝐞𝐬, including researchers, founders, policymakers, and students, all contributing to a remarkable evening of conversation and connection.

- date: 2025-05-20
  content: |-
    I will give a talk titled 'AI-Assisted Data Analysis and Curatorial Planning for Museums' at Oxford Digital Scholarship coffee mornings. These informal networking events are a chance to meet colleagues interested in digital scholarship research and hear about projects around the university. With talks ranging from ChatGPT for cultural heritage to video games, come along and find out more!
    Time: 20th May, 3rd June, 10.30 – 11.30 AM
    Venue: Visiting Scholars Centre, Weston Library

