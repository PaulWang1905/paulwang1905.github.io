[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxie"
version = "0.1.0"
description = "A small static site/blog generator: Markdown + Jinja2 + Tailwind"
readme = "readme.md"
requires-python = ">=3.8"
authors = [{ name = "Puyu Wang" }]
license = { text = "ISC" }
dependencies = [
    "Jinja2>=3.1",
    "Markdown>=3.6",
    "pymdown-extensions>=10.0",
    "python-frontmatter>=1.1",
    "Pygments>=2.17",
    "pillow>=10.0",
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["oxie"]
